name: Actualizar EPG OmniStream
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4,16 * * *'
permissions:
  contents: write
jobs:
  epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Combinar EPG España Reino Unido Canadá
        run: python3 scripts/merge_epg.py
      - name: Publicar guía
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add epg/guide.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar EPG multirregional OmniStream'
            git push
          fi
