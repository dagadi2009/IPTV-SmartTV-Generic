<!-- REV 1.2.2 - OMNISTREAM PLAYER SMART TV & AUTOMATIC EPG/LOGOS -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniStream Player - Smart TV & Mobile</title>

    <!-- Shaka Player (Google - DASH / DRM Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <!-- HLS.js (HLS Backup Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.0/hls.min.js"></script>

    <style>
        :root {
            --bg-primary: #080b11;
            --bg-secondary: #0f172a;
            --bg-card: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --focus-glow: 0 0 20px rgba(59, 130, 246, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }

        header { background: var(--bg-secondary); padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .logo-box { display: flex; align-items: center; gap: 12px; }
        .logo-box svg { fill: var(--accent); width: 32px; height: 32px; }
        .logo-title { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.5px; }
        .logo-tag { font-size: 0.75rem; background: var(--accent); color: white; padding: 2px 8px; border-radius: 12px; font-weight: bold; }

        .btn { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:hover, .btn:focus { background: var(--accent-hover); outline: 3px solid #ffffff; box-shadow: var(--focus-glow); }
        .btn-secondary { background: var(--bg-card); color: var(--text-main); }
        .btn-secondary:hover { background: #334155; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-xs { padding: 4px 8px; font-size: 0.75rem; border-radius: 6px; }

        main { display: grid; grid-template-columns: 1fr; gap: 20px; padding: 20px; max-width: 1650px; margin: 0 auto; width: 100%; filter: blur(0px); transition: filter 0.3s; }
        main.locked { filter: blur(12px); pointer-events: none; }

        @media(min-width: 1024px) { main { grid-template-columns: 380px 1fr; } }

        .sidebar { display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--bg-secondary); border-radius: 14px; padding: 18px; border: 1px solid rgba(255,255,255,0.05); }
        .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }

        .player-container { background: black; border-radius: 14px; overflow: hidden; position: relative; width: 100%; aspect-ratio: 16/9; box-shadow: 0 10px 35px rgba(0,0,0,0.7); }
        video { width: 100%; height: 100%; object-fit: contain; }
        video.fit-cover { object-fit: cover; }
        video.fit-fill { object-fit: fill; }

        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .input-group label { font-size: 0.85rem; color: var(--text-sub); }
        input, select { background: var(--bg-primary); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main); padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; }
        input:focus, select:focus { outline: 2px solid var(--accent); box-shadow: var(--focus-glow); }

        .saved-playlists-list { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; margin-top: 10px; }
        .playlist-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; border: 1px solid transparent; }
        .playlist-item-name { font-weight: 600; cursor: pointer; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; max-height: 540px; overflow-y: auto; padding-right: 5px; }
        .channel-card { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-card); border-radius: 10px; cursor: pointer; border: 2px solid transparent; transition: all 0.2s; position: relative; }
        .channel-card:hover, .channel-card:focus { border-color: var(--accent); background: #334155; outline: none; box-shadow: var(--focus-glow); transform: scale(1.02); }
        .channel-card.active { border-color: var(--success); background: #0f382c; }
        
        .ch-logo { width: 48px; height: 48px; border-radius: 8px; background: var(--bg-primary); object-fit: contain; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; overflow: hidden; }
        .ch-logo img { width: 100%; height: 100%; object-fit: contain; }
        .ch-details { flex: 1; overflow: hidden; }
        .ch-name { font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ch-epg-now { font-size: 0.8rem; color: var(--accent); font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .epg-progress-bg { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 5px; overflow: hidden; }
        .epg-progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

        .fav-star { font-size: 1.2rem; color: rgba(255,255,255,0.2); cursor: pointer; padding: 4px; transition: color 0.2s; }
        .fav-star.active { color: var(--warning); }

        .epg-bar { background: rgba(15, 23, 42, 0.95); border-radius: 10px; padding: 14px 18px; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 4px; }
        .epg-title { font-size: 0.85rem; color: var(--text-sub); display: flex; justify-content: space-between; }
